name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-size: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Verify Database Schema (Drizzle Generate)
      run: npx drizzle-kit generate
      env:
        # Provide fallback/mock environment variables if your schema requires them to evaluate
        DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/mock' }}

    - name: Run ESLint (Static Analysis)
      run: npm run lint

    - name: Run TypeScript Type Check
      run: npx tsc --noEmit

    - name: Build Next.js Application
      run: npm run build
      env:
        # Prevents build from skipping optimization or breaking due to missing runtime env vars
        NEXT_PUBLIC_APP_ENV: production
