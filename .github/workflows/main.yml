name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Fixed parameter name from node-size to node-version

    - name: Install Dependencies
      run: npm install # Uses npm install to automatically build dependencies if package-lock is missing

    - name: Verify Database Schema (Drizzle Generate)
      run: npx drizzle-kit generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/mock' }}

    - name: Run ESLint (Static Analysis)
      run: npm run lint

    - name: Run TypeScript Type Check
      run: npx tsc --noEmit

    - name: Build Next.js Application
      run: npm run build
      env:
        NEXT_PUBLIC_APP_ENV: production
